name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (test + build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Fyne / CGO build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libgl1-mesa-dev libgl1-mesa-dri xorg-dev libxkbcommon-dev xvfb xauth
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Test (full, CGO + race)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: Build Linux package
        run: |
          bash scripts/build-linux.sh
          mv dist/dbdregion dist/dbdregion-linux-amd64
      - name: Smoke-test Linux package
        run: |
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 timeout 6 xvfb-run -a dist/dbdregion-linux-amd64 > /tmp/dbd-smoke.log 2>&1
          code=$?
          set -e
          cat /tmp/dbd-smoke.log
          test "$code" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: dbdregion-linux-amd64
          path: dist/dbdregion-linux-amd64
          if-no-files-found: error

  windows:
    name: Windows (test + build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up MinGW (gcc for CGO)
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
          static: 0
      - name: Test (full, CGO + race)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build Windows package
        run: |
          ./scripts/build-windows.ps1
          Move-Item dist/dbdregion.exe dist/dbdregion-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: dbdregion-windows-amd64
          path: dist/dbdregion-windows-amd64.exe
          if-no-files-found: error
